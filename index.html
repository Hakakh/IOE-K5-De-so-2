<body class="bg-slate-100 text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 1. TYPES & ENUMS ---
        const QuestionType = {
            MULTIPLE_CHOICE: 'MULTIPLE_CHOICE',
            FILL_IN_BLANK: 'FILL_IN_BLANK',
            REARRANGE: 'REARRANGE'
        };

        const GameState = {
            START: 'START',
            PLAYING: 'PLAYING',
            FINISHED: 'FINISHED'
        };

        // --- 2. CONSTANTS & DATA ---
        const cleanUrl = (url) => {
            if (!url) return undefined;
            return url.trim()
                .replace(/\s+/g, '') // Remove spaces
                .replace(/res\.ioe\.vnzedu/, 'res.ioe.vn/edu') // Fix domain typos
                .replace(/res\.ioe\.vii/, 'res.ioe.vn')
                .replace(/res\.ioe\.vm/, 'res.ioe.vn')
                .replace(/Audio\s*mp3/i, 'Audio.mp3') // Fix extension
                .replace(/ImageExam\s*(\d)/, 'ImageExam/$1') // Fix path separators
                .replace(/Olympic\s*ExamData/, 'OlympicExamData')
                .replace(/EOlympic\s*ExamData/, 'EOlympic/ExamData')
                .replace(/'/g, '') // Remove accidental quotes
                .replace(/Audio-mp3/i, 'Audio.mp3');
        };

        // Full Question Data for IOE K5 No. 02
        const QUIZ_DATA = [
  { id: 1, type: QuestionType.MULTIPLE_CHOICE, questionText: "His mother is a doctor. She works in a ….", options: ["hospital", "post office", "restaurant", "cinema"], correctAnswer: "hospital", explanation: "Doctor (Bác sĩ) làm việc ở Hospital (Bệnh viện)." },
  { id: 2, type: QuestionType.MULTIPLE_CHOICE, questionText: "It rains _______ in October this year.", imageUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/Thi%20Th%E1%BB%AD/Thi_trai_nghiem_2021/Lop5/Images/tn-36.jpg"), options: ["many", "a lots of", "a lot", "heavy"], correctAnswer: "a lot", explanation: "Rain a lot: Mưa nhiều ('a lots of' sai ngữ pháp, phải là 'lots of'; 'many' dùng cho danh từ đếm được)." },
  { id: 3, type: QuestionType.FILL_IN_BLANK, questionText: "_ _ _ _ _ do Peter and July come from?", correctAnswer: "Where", explanation: "Where do... come from?: ...đến từ đâu?" },
  { id: 4, type: QuestionType.FILL_IN_BLANK, questionText: "MAT_ H", correctAnswer: "C", explanation: "MATCH: Trận đấu/Que diêm." },
  { id: 5, type: QuestionType.FILL_IN_BLANK, questionText: "DO_ L", correctAnswer: "L", explanation: "DOLL: Búp bê." },
  { id: 6, type: QuestionType.MULTIPLE_CHOICE, questionText: "I don’t like this noisy place. I prefer a … once.", options: ["beautiful", "peaceful", "modern", "friendly"], correctAnswer: "peaceful", explanation: "Trái nghĩa với Noisy (ồn ào) trong ngữ cảnh nơi chốn là Peaceful (yên bình)." },
  { id: 7, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["club", "to the music", "Sarah goes", "twice a week,", "on Thursday and Sunday."], correctAnswer: "Sarah goes to the music club twice a week, on Thursday and Sunday.", explanation: "Sarah đến câu lạc bộ âm nhạc hai lần một tuần, vào thứ Năm và Chủ Nhật." },
  { id: 8, type: QuestionType.MULTIPLE_CHOICE, questionText: "Listen and tick", audioUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/Thi%20Th%E1%BB%AD/Thi_trai_nghiem_2021/Lop5/tracnghiem/tn-58.mp3"), options: ["It's the most exciting event in London every year.", "It's the most exciting event in London every month.", "It's the most exciting event in London every week.", "It's the most exciting event in London every day."], correctAnswer: "It's the most exciting event in London every year.", explanation: "Nghe audio: Sự kiện thú vị nhất hàng năm." },
  { id: 9, type: QuestionType.FILL_IN_BLANK, questionText: "BL_ USE", correctAnswer: "O", explanation: "BLOUSE: Áo kiểu nữ." },
  { id: 10, type: QuestionType.MULTIPLE_CHOICE, questionText: "She usually comes ... home at5 pm.", options: ["to", "at", "Ø", "in"], correctAnswer: "Ø", explanation: "Come home: Về nhà (không dùng giới từ 'to' trước home trong cụm này)." },
  { id: 11, type: QuestionType.FILL_IN_BLANK, questionText: "Who’s that boy on the _ _ _ _ _ ?", audioUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/ImageExam/2013/11/20/635205574197145804_Audio.mp3"), correctAnswer: "stage", explanation: "Nghe audio: Cậu bé trên sân khấu." },
  { id: 12, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["the new", "sports", "Do you", "hear about", "centre?"], correctAnswer: "Do you hear about the new sports centre?", explanation: "Bạn có nghe tin về trung tâm thể thao mới không?" },
  { id: 13, type: QuestionType.MULTIPLE_CHOICE, questionText: "I like my sister’s house. It is a ….", options: ["house new beautiful", "beautiful house new", "beautiful new house", "new house beautiful"], correctAnswer: "beautiful new house", explanation: "Trật tự tính từ: Quan điểm (beautiful) -> Tuổi tác (new) -> Danh từ." },
  { id: 14, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["after", "brush our teeth", "every", "meals.", "Should we"], correctAnswer: "Should we brush our teeth after every meals.", explanation: "Chúng ta có nên đánh răng sau mỗi bữa ăn không." },
  { id: 15, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["going on", "for", "a holiday", "I’m", "three weeks."], correctAnswer: "I’m going on a holiday for three weeks.", explanation: "Tôi sẽ đi nghỉ mát trong 3 tuần." },
  { id: 16, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["Linda and Mai", "at break time.", "in the school yard", "play badminton"], correctAnswer: "Linda and Mai play badminton in the school yard at break time.", explanation: "Linda và Mai chơi cầu lông ở sân trường vào giờ giải lao." },
  { id: 17, type: QuestionType.MULTIPLE_CHOICE, questionText: "... she want an egg?", options: ["Are", "Is", "Do", "Does"], correctAnswer: "Does", explanation: "She (ngôi thứ 3 số ít) + động từ thường (want) -> Trợ động từ Does." },
  { id: 18, type: QuestionType.FILL_IN_BLANK, questionText: "I go to the bookshop to bu_ some comic books.", correctAnswer: "y", explanation: "Buy: Mua." },
  { id: 19, type: QuestionType.FILL_IN_BLANK, questionText: "DIFF_ CULT", correctAnswer: "I", explanation: "DIFFICULT: Khó khăn." },
  { id: 20, type: QuestionType.MULTIPLE_CHOICE, questionText: "Every morning, I ... up at7 o’clock.", options: ["gets", "to get", "get", "getting"], correctAnswer: "get", explanation: "Hiện tại đơn với chủ ngữ I -> Get." },
  { id: 21, type: QuestionType.FILL_IN_BLANK, questionText: "I don’t want to fail my _ _ _ _ _ .", audioUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/ImageExam/2018/1/5/636507130941353446_Audio.mp3"), correctAnswer: "exams", explanation: "Fail exams: Thi trượt." },
  { id: 22, type: QuestionType.MULTIPLE_CHOICE, questionText: "Odd one out:", options: ["flower", "lake", "tree", "garden"], correctAnswer: "lake", explanation: "'Lake' là hồ nước, các từ còn lại liên quan đến thực vật/vườn tược." },
  { id: 23, type: QuestionType.MULTIPLE_CHOICE, questionText: "Choose the word that has the underlined part pronounced differently:", options: ["onion", "dozen", "open", "come"], correctAnswer: "open", explanation: "'Open' /əʊ/, các từ còn lại /ʌ/ (onion, dozen, come)." },
  { id: 24, type: QuestionType.MULTIPLE_CHOICE, questionText: "Lan doesn’t like fish so she ... eats it.", options: ["always", "often", "never", "usually"], correctAnswer: "never", explanation: "Doesn't like (không thích) -> Never (không bao giờ ăn)." },
  { id: 25, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["your sister", "Does", "listen to", "every day?", "music"], correctAnswer: "Does your sister listen to music every day?", explanation: "Chị của bạn có nghe nhạc mỗi ngày không?" },
  { id: 26, type: QuestionType.FILL_IN_BLANK, questionText: "Peter is so c_ _ _ _ _ _ . He often checks his writing twice before giving it to the teacher.", correctAnswer: "areful", explanation: "Careful: Cẩn thận." },
  { id: 27, type: QuestionType.MULTIPLE_CHOICE, questionText: "Our uncle is an engineer. ’’Our uncle’’ means ’’…’’. ", options: ["he", "him", "his", "they"], correctAnswer: "he", explanation: "Uncle (Chú/Bác trai) tương đương đại từ He (Ông ấy)." },
  { id: 28, type: QuestionType.MULTIPLE_CHOICE, questionText: "How many ... are there? - There are ten.", options: ["pencils", "box", "notebook", "pen"], correctAnswer: "pencils", explanation: "How many + Danh từ số nhiều (pencils)." },
  { id: 29, type: QuestionType.FILL_IN_BLANK, questionText: "_ _ _ _ _ is he from?", correctAnswer: "Where", explanation: "Where is he from?: Anh ấy đến từ đâu?" },
  { id: 30, type: QuestionType.MULTIPLE_CHOICE, questionText: "I like English most. It's my ____ subject.", options: ["loved", "lovely", "best", "favourite"], correctAnswer: "favourite", explanation: "Favourite subject: Môn học yêu thích." },
  { id: 31, type: QuestionType.FILL_IN_BLANK, questionText: "_ _ _ _ _ _ in my family likes staying at home alone.", correctAnswer: "Nobody", explanation: "Nobody: Không ai (phù hợp ngữ cảnh và số ký tự)." },
  { id: 32, type: QuestionType.MULTIPLE_CHOICE, questionText: "Choose the word that has the underlined part pronounced differently from the others:", options: ["invent", "decide", "combine", "provide"], correctAnswer: "invent", explanation: "'Invent' /i/, các từ còn lại /ai/ (decide, combine, provide)." },
  { id: 33, type: QuestionType.MULTIPLE_CHOICE, questionText: "…? – I’m tired!", options: ["How are you feel, Ken", "How do you feel, Ken", "How can you feel, Ken", "How would you feel, Ken"], correctAnswer: "How do you feel, Ken", explanation: "Hỏi cảm giác: How do you feel?" },
  { id: 34, type: QuestionType.FILL_IN_BLANK, questionText: "My grandparents li_ _ in a village.", correctAnswer: "ve", explanation: "Live: Sống." },
  { id: 35, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["love", "with children", "They", "working", "very much."], correctAnswer: "They love working with children very much.", explanation: "Họ rất thích làm việc với trẻ em." },
  { id: 36, type: QuestionType.FILL_IN_BLANK, questionText: "Let's have t_ o teams to play football.", audioUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/Thi_cac_cap/2020-2021/Lop5/Captruong/Audio/04-dt-32.mp3"), correctAnswer: "w", explanation: "Two: Hai (đội)." },
  { id: 37, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["English", "can speak", "Nga and Lan", "fluently."], correctAnswer: "Nga and Lan can speak English fluently.", explanation: "Nga và Lan có thể nói tiếng Anh trôi chảy." },
  { id: 38, type: QuestionType.FILL_IN_BLANK, questionText: "Where were you _ orn?", correctAnswer: "b", explanation: "Born: Sinh ra." },
  { id: 39, type: QuestionType.MULTIPLE_CHOICE, questionText: "It’s very … and warm today.", options: ["cloudy", "cloud", "clouds", "clouding"], correctAnswer: "cloudy", explanation: "Cloudy (tính từ): Có mây." },
  { id: 40, type: QuestionType.MULTIPLE_CHOICE, questionText: "Choose the word that has the underlined part pronounced differently:", options: ["children", "church", "headache", "beach"], correctAnswer: "headache", explanation: "'Headache' /k/, các từ còn lại /tʃ/." },
  { id: 41, type: QuestionType.MULTIPLE_CHOICE, questionText: "My French penpal, Jack can speak six ….", options: ["speeches", "countries", "languages", "nationalities"], correctAnswer: "languages", explanation: "Speak languages: Nói ngôn ngữ." },
  { id: 42, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["Was", "Monday", "yesterday?", "it"], correctAnswer: "Was it Monday yesterday?", explanation: "Hôm qua có phải là thứ Hai không?" },
  { id: 43, type: QuestionType.FILL_IN_BLANK, questionText: "The boys come from Korea so they are _ _ _ _ _ _ .", correctAnswer: "Korean", explanation: "Korean: Người Hàn Quốc." },
  { id: 44, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["walk there", "My house is", "near a market,", "so I often", "and buy things."], correctAnswer: "My house is near a market, so I often walk there and buy things.", explanation: "Nhà tôi gần chợ nên tôi thường đi bộ ra đó mua đồ." },
  { id: 45, type: QuestionType.FILL_IN_BLANK, questionText: "You were absent _ _ _ _ school this morning. What’s the trouble?", correctAnswer: "from", explanation: "Absent from: Vắng mặt." },
  { id: 46, type: QuestionType.FILL_IN_BLANK, questionText: "CHE_ R", audioUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/Thi_cac_cap/2020-2021/Lop5/Captruong/Audio/03-dt-32.mp3"), correctAnswer: "E", explanation: "CHEER: Cổ vũ (hoặc trong từ CHEERFUL)." },
  { id: 47, type: QuestionType.FILL_IN_BLANK, questionText: "J_ LY", correctAnswer: "U", explanation: "JULY: Tháng Bảy." },
  { id: 48, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["his work", "finishes", "My father", "at4.30.", "often"], correctAnswer: "My father often finishes his work at 4.30.", explanation: "Bố tôi thường kết thúc công việc lúc 4:30." },
  { id: 49, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["to school.", "and go", "After", "I get dressed", "breakfast,"], correctAnswer: "After breakfast, I get dressed and go to school.", explanation: "Sau bữa sáng, tôi mặc quần áo và đi học." },
  { id: 50, type: QuestionType.MULTIPLE_CHOICE, questionText: "He likes reading books. He ... a book about Uncle Ho’s life.", options: ["is reading", "read", "red", "to read"], correctAnswer: "is reading", explanation: "Hành động đang diễn ra -> is reading." },
  { id: 51, type: QuestionType.FILL_IN_BLANK, questionText: "My favourite subject is _ _ _ tory.", correctAnswer: "His", explanation: "History: Lịch sử." },
  { id: 52, type: QuestionType.MULTIPLE_CHOICE, questionText: "What’s in the sky?", audioUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/ImageExam/2016/11/29/636160300911962662_Audio.mp3"), options: ["A cloud.", "A rainbow.", "A plane.", "A kite"], correctAnswer: "A rainbow.", explanation: "Nghe audio: Cầu vồng." },
  { id: 53, type: QuestionType.FILL_IN_BLANK, questionText: "I like spending my free _ _ _ _ with my friends on Sunday.", correctAnswer: "time", explanation: "Free time: Thời gian rảnh." },
  { id: 54, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["have", "after", "Let’s", "some ice-cream", "school."], correctAnswer: "Let’s have some ice-cream after school.", explanation: "Hãy cùng ăn kem sau giờ học nhé." },
  { id: 55, type: QuestionType.MULTIPLE_CHOICE, questionText: "Choose the word that has the underlined part pronounced differently:", options: ["do", "mother", "brother", "sometimes"], correctAnswer: "do", explanation: "'Do' /u:/, các từ còn lại /ʌ/." },
  { id: 56, type: QuestionType.MULTIPLE_CHOICE, questionText: "Mary often goes ... in the morning.", audioUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/ImageExam/2013/11/21/635206394479034553_Audio.mp3"), options: ["walking", "jogging", "talking", "fishing"], correctAnswer: "jogging", explanation: "Nghe audio: Đi bộ thể dục." },
  { id: 57, type: QuestionType.MULTIPLE_CHOICE, questionText: "When will you arriver? – Come and see me at … o’clock.", audioUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/ImageExam/2018/1/5/636507131401041895_Audio.mp3"), options: ["nine", "ten", "eleven", "twelve"], correctAnswer: "eleven", explanation: "Nghe audio: 11 giờ." },
  { id: 58, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["Please", "the phone", "for", "me.", "answer"], correctAnswer: "Please answer the phone for me.", explanation: "Làm ơn nghe điện thoại giúp tôi." },
  { id: 59, type: QuestionType.MULTIPLE_CHOICE, questionText: "Listen and tick:", audioUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/ImageExam/2013/11/20/635205575231739621_Audio.mp3"), options: ["My grandmother will prepare some food for the picnic.", "My grandmother will prepare some fruits for the picnic.", "My mother will prepare some food for the picnic.", "My mother will prepare some foot for the picnic."], correctAnswer: "My mother will prepare some food for the picnic.", explanation: "Nghe audio." },
  { id: 60, type: QuestionType.MULTIPLE_CHOICE, questionText: "… did it take to get there by train? – Two hours.", options: ["How long", "How often", "How old", "How much"], correctAnswer: "How long", explanation: "Hỏi thời gian bao lâu: How long." },
  { id: 61, type: QuestionType.FILL_IN_BLANK, questionText: "COUSIN", correctAnswer: "S", explanation: "COUSIN: Anh chị em họ (Đáp án đề bài cho sẵn từ? Có thể là điền ký tự thiếu nếu đề lỗi, nhưng ở đây là từ hoàn chỉnh. Nếu là điền từ, có thể là COU_IN -> S)." },
  { id: 62, type: QuestionType.FILL_IN_BLANK, questionText: "I’m going to tell a _ _ _ _ _ _ _ _ story.", audioUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/ImageExam/2013/11/20/635205574105729643_Audio.mp3"), correctAnswer: "japanese", explanation: "A Japanese story (Chuyện Nhật Bản)." },
  { id: 63, type: QuestionType.MULTIPLE_CHOICE, questionText: "Choose the odd one:", options: ["football", "song", "tennis", "badminton"], correctAnswer: "song", explanation: "'Song' là bài hát, còn lại là môn thể thao." },
  { id: 64, type: QuestionType.FILL_IN_BLANK, questionText: "PIC TURE", correctAnswer: "T", explanation: "PICTURE: Bức tranh." },
  { id: 65, type: QuestionType.FILL_IN_BLANK, questionText: "Nam and his friends took photographs and ate cake.", correctAnswer: "s", explanation: "Cake(s) hoặc ate (some) cakes. Câu này có vẻ là câu hoàn chỉnh? Nếu là điền từ: cakes." },
  { id: 66, type: QuestionType.FILL_IN_BLANK, questionText: "What do you usually do on Saturday evenings, Mary?", correctAnswer: "on", explanation: "On + thứ trong tuần." },
  { id: 67, type: QuestionType.FILL_IN_BLANK, questionText: "ENJOY", correctAnswer: "J", explanation: "ENJOY: Thưởng thức." },
  { id: 68, type: QuestionType.FILL_IN_BLANK, questionText: "Do you like staying with English people?", correctAnswer: "with", explanation: "Stay with: Ở cùng với." },
  { id: 69, type: QuestionType.FILL_IN_BLANK, questionText: "The man in the car is our new teacher.", correctAnswer: "is", explanation: "The man (số ít) -> is." },
  { id: 70, type: QuestionType.MULTIPLE_CHOICE, questionText: "My father likes ... the newspaper very much.", options: ["to read", "reading", "read", "reads"], correctAnswer: "reading", explanation: "Like + V-ing: Thích làm gì." },
  { id: 71, type: QuestionType.FILL_IN_BLANK, questionText: "Hung is interested in collecting _ _ _ _ _ _ .", imageUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/ImageExam/2014/11/21/635521622827036665_566X320.jpg"), correctAnswer: "in", explanation: "sưu tầm tem." },
  { id: 72, type: QuestionType.FILL_IN_BLANK, questionText: "What is your favourite game?", correctAnswer: "is", explanation: "What is..." },
  { id: 73, type: QuestionType.FILL_IN_BLANK, questionText: "There is a picture of Uncle Ho above the blackboard.", correctAnswer: "above", explanation: "Above: Ở phía trên." },
  { id: 74, type: QuestionType.MULTIPLE_CHOICE, questionText: "The tigers like eating _______.", imageUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/Thi_cac_cap/2020-2021/Lop5/Captruong/Images/04-tn-55.jpg"), options: ["leaves", "vegetables", "meat", "fruits"], correctAnswer: "meat", explanation: "Hổ ăn thịt (meat)." },
  { id: 75, type: QuestionType.MULTIPLE_CHOICE, questionText: "Edward _____ Vietnam2 years ago.", options: ["visits", "visited", "visit", "will visit"], correctAnswer: "visited", explanation: "2 years ago -> Quá khứ đơn." },
  { id: 76, type: QuestionType.MULTIPLE_CHOICE, questionText: "Choose the word that has the underlined part pronounced differently:", options: ["strong", "bottle", "box", "cold"], correctAnswer: "cold", explanation: "'Cold' /əʊ/, các từ còn lại /ɒ/." },

  { id: 186, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["prefer,", "fairy tales or", "you", "short stories?", "What do"], correctAnswer: "What do you prefer, fairy tales or short stories?", explanation: "Bạn thích cái nào hơn, truyện cổ tích hay truyện ngắn?" },
  { id: 187, type: QuestionType.REARRANGE, questionText: "Sắp xếp câu:", rearrangeParts: ["Dwarfts", "The Seven", "are short", "and hard-working."], correctAnswer: "The Seven Dwarfts are short and hard-working.", explanation: "Bảy chú lùn thì thấp và chăm chỉ." },
  { id: 188, type: QuestionType.MULTIPLE_CHOICE, questionText: "I’m cleaning the floor. Can you help ...?", options: ["I", "me", "my", "you"], correctAnswer: "me", explanation: "Help me: Giúp tôi (tân ngữ)." },
  { id: 189, type: QuestionType.FILL_IN_BLANK, questionText: "When _ _ your birthday?", correctAnswer: "is", explanation: "When is...: Khi nào là..." },
  { id: 190, type: QuestionType.FILL_IN_BLANK, questionText: "Do you think tennis is the _ _ _ _ expensive sport?", correctAnswer: "most", explanation: "The most expensive: Đắt đỏ nhất (So sánh nhất)." },
  { id: 191, type: QuestionType.FILL_IN_BLANK, questionText: "I often surf the internet on my _ _ _ _ _ _ _ _ .", imageUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/ImageExam/2013/11/20/635205557610104670_566X320.jpg"), correctAnswer: "computer", explanation: "Computer: Máy tính." },
  { id: 192, type: QuestionType.FILL_IN_BLANK, questionText: "DO_ N", correctAnswer: "W", explanation: "DOWN: Xuống." },
  { id: 193, type: QuestionType.FILL_IN_BLANK, questionText: "B_ ACH", correctAnswer: "E", explanation: "BEACH: Bãi biển." },
  { id: 194, type: QuestionType.MULTIPLE_CHOICE, questionText: "Odd one out:", options: ["Vietnamese", "English", "American", "France"], correctAnswer: "France", explanation: "'France' là tên nước, các từ còn lại là quốc tịch/ngôn ngữ." },
  { id: 195, type: QuestionType.MULTIPLE_CHOICE, questionText: "Which sentence is correct?", options: ["What job her is?", "What is her job?", "What is job her?", "What job is her?"], correctAnswer: "What is her job?", explanation: "Cấu trúc đúng: What is + tính từ sở hữu + job?" },
  { id: 196, type: QuestionType.FILL_IN_BLANK, questionText: "Have fr_ _ ice creams!", audioUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/Thi_cac_cap/2020-2021/Lop5/Captruong/Audio/01-dt-59.mp3"), correctAnswer: "ee", explanation: "Free: Miễn phí." },
  { id: 197, type: QuestionType.MULTIPLE_CHOICE, questionText: "He is from … .", audioUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/ImageExam/2016/11/29/636160300260086896_Audio.mp3"), options: ["the US", "the UK", "England", "America"], correctAnswer: "the UK", explanation: "Nghe audio." },
  { id: 198, type: QuestionType.MULTIPLE_CHOICE, questionText: "What are you doing? - ... are planting some trees.", options: ["We", "Us", "Our", "Ours"], correctAnswer: "We", explanation: "Hỏi 'you' (các bạn) -> Trả lời 'We' (chúng tôi)." },
  { id: 199, type: QuestionType.FILL_IN_BLANK, questionText: "What d_ _ you do at the Festival?", correctAnswer: "id", explanation: "Did: Đã làm (quá khứ)." },
  { id: 200, type: QuestionType.FILL_IN_BLANK, questionText: "The teacher is talking about her st_ _ _ _ _ _ .", imageUrl: cleanUrl("https://res.ioe.vn/edu/EOlympic/ExamData/ImageExam/2016/11/29/636160348472997965_566X320.jpg"), correctAnswer: "udents", explanation: "Students: Học sinh." }
];

        // --- 3. COMPONENTS ---
        
        // Button
        const Button = ({ children, variant = 'primary', size = 'md', className = '', ...props }) => {
             const baseStyles = "inline-flex items-center justify-center font-bold transition-all duration-200 rounded-full focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm transform active:scale-95";
             const variants = {
                primary: "bg-blue-600 hover:bg-blue-700 text-white shadow-blue-500/30 focus:ring-blue-500",
                secondary: "bg-emerald-500 hover:bg-emerald-600 text-white shadow-emerald-500/30 focus:ring-emerald-500",
                danger: "bg-rose-500 hover:bg-rose-600 text-white shadow-rose-500/30 focus:ring-rose-500",
                outline: "bg-white border-2 border-slate-300 text-slate-600 hover:border-blue-500 hover:text-blue-600"
             };
             const sizes = {
                sm: "px-4 py-1.5 text-sm",
                md: "px-6 py-3 text-base",
                lg: "px-8 py-4 text-lg"
             };
             return (
                <button className={`${baseStyles} ${variants[variant]} ${sizes[size]} ${className}`} {...props}>
                    {children}
                </button>
             );
        };

        // StartScreen
        const StartScreen = ({ onStart }) => {
            const [name, setName] = useState('');
            const handleSubmit = (e) => {
                e.preventDefault();
                if (name.trim()) onStart(name.trim());
            };
            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-cyan-500 to-blue-600 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center animate-slide-up">
                        <div className="mb-8">
                            <div className="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                                </svg>
                            </div>
                            <h1 className="text-3xl font-extrabold text-slate-800 mb-2">IOE K5 - Đề số 2</h1>
                            <p className="text-slate-500">Luyện thi tiếng Anh IOE cùng AI Master</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="text-left">
                                <label className="block text-sm font-medium text-slate-700 mb-2">Tên của bạn</label>
                                <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="Nhập tên..." className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all" required />
                            </div>
                            <Button type="submit" className="w-full" size="lg" disabled={!name.trim()}>Bắt đầu chơi</Button>
                        </form>
                    </div>
                </div>
            );
        };

        // AudioPlayer
        const AudioPlayer = ({ src }) => {
            const audioRef = useRef(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const togglePlay = () => {
                if (audioRef.current) {
                    if (isPlaying) audioRef.current.pause();
                    else audioRef.current.play();
                    setIsPlaying(!isPlaying);
                }
            };
            return (
                <div className="flex items-center gap-3 bg-slate-100 p-3 rounded-lg border border-slate-200">
                    <button type="button" onClick={togglePlay} className="flex-shrink-0 w-10 h-10 flex items-center justify-center bg-blue-600 text-white rounded-full hover:bg-blue-700 transition-colors">
                        {isPlaying ? (
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd" /></svg>
                        ) : (
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 translate-x-0.5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd" /></svg>
                        )}
                    </button>
                    <span className="text-sm font-semibold text-slate-600 uppercase tracking-wide">Nghe câu hỏi</span>
                    <audio ref={audioRef} src={src} onEnded={() => setIsPlaying(false)} className="hidden" />
                </div>
            );
        };

        // QuestionGrid
        const QuestionGrid = ({ questions, userAnswers, currentIndex, onJump, onClose }) => {
            const getStatusColor = (q, index) => {
                const answer = userAnswers.find(a => a.questionId === q.id);
                if (index === currentIndex) return "ring-2 ring-blue-500 ring-offset-2 border-blue-500 bg-white text-blue-600";
                if (!answer) return "bg-slate-100 text-slate-400 border-transparent";
                if (answer.isCorrect) return "bg-green-500 text-white border-green-600";
                return "bg-red-500 text-white border-red-600";
            };
            const answeredCount = userAnswers.length;
            return (
                <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden animate-slide-up">
                        <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <div><h2 className="text-xl font-bold text-slate-800">Danh sách câu hỏi</h2><p className="text-sm text-slate-500">Đã làm: {answeredCount} / {questions.length}</p></div>
                            <button onClick={onClose} className="p-2 hover:bg-slate-200 rounded-full transition-colors"><svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg></button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-6 custom-scrollbar">
                            <div className="grid grid-cols-5 sm:grid-cols-8 md:grid-cols-10 gap-3">
                                {questions.map((q, idx) => (
                                    <button key={q.id} onClick={() => { onJump(idx); onClose(); }} className={`h-10 w-10 rounded-lg flex items-center justify-center text-sm font-bold border transition-all hover:scale-105 ${getStatusColor(q, idx)}`}>{idx + 1}</button>
                                ))}
                            </div>
                        </div>
                        <div className="p-4 bg-slate-50 border-t border-slate-100 text-xs text-slate-500 flex gap-4 justify-center flex-wrap">
                            <div className="flex items-center gap-2"><span className="w-3 h-3 bg-green-500 rounded-full"></span> Đúng</div>
                            <div className="flex items-center gap-2"><span className="w-3 h-3 bg-red-500 rounded-full"></span> Sai</div>
                            <div className="flex items-center gap-2"><span className="w-3 h-3 ring-2 ring-blue-500 ring-offset-1 rounded-full"></span> Đang làm</div>
                            <div className="flex items-center gap-2"><span className="w-3 h-3 bg-slate-200 rounded-full"></span> Chưa làm</div>
                        </div>
                    </div>
                </div>
            );
        };

        // QuestionCard
        const QuestionCard = ({ question, onAnswer, isAnswered, userAnswer }) => {
            const [inputVal, setInputVal] = useState('');
            const [selectedParts, setSelectedParts] = useState([]);
            const [showHint, setShowHint] = useState(false);
            const [hintText, setHintText] = useState('');
            const [hiddenOptions, setHiddenOptions] = useState([]);
            
            useEffect(() => { 
                setInputVal(''); 
                setSelectedParts([]); 
                setShowHint(false);
                setHintText('');
                setHiddenOptions([]);
            }, [question.id]);

            const cleanStringForHint = (str) => str.trim().replace(/[.,!?;:'"]/g, '');

            const generateHint = () => {
                if (hintText) return;

                let text = '';
                switch (question.type) {
                    case QuestionType.MULTIPLE_CHOICE:
                        const wrongOptions = question.options?.filter(opt => opt !== question.correctAnswer) || [];
                        const countToHide = question.options.length > 3 ? 2 : 1;
                        const shuffledWrong = [...wrongOptions].sort(() => 0.5 - Math.random());
                        const toHide = shuffledWrong.slice(0, countToHide);
                        setHiddenOptions(toHide);
                        text = `Gợi ý 50/50: Hệ thống đã loại bỏ ${toHide.length} phương án sai.`;
                        break;
                    
                    case QuestionType.FILL_IN_BLANK:
                        const answer = cleanStringForHint(question.correctAnswer);
                        const firstChar = answer.charAt(0);
                        const lastChar = answer.charAt(answer.length - 1);
                        let masked = firstChar;
                        for (let i = 1; i < answer.length - 1; i++) {
                             masked += answer[i] === ' ' ? ' ' : '_';
                        }
                        if (answer.length > 1) masked += lastChar;
                        
                        const niceMask = masked.split('').join(' ');
                        text = `Đáp án có ${answer.length} ký tự. Khuôn dạng: "${niceMask}"`;
                        break;

                    case QuestionType.REARRANGE:
                        const words = question.correctAnswer.split(' ');
                        const revealCount = Math.max(2, Math.ceil(words.length * 0.3));
                        const hintPhrase = words.slice(0, revealCount).join(' ');
                        text = `Gợi ý cấu trúc: Câu này bắt đầu bằng cụm từ: "${hintPhrase} ..."`;
                        break;
                }
                setHintText(text);
            };

            const toggleHint = () => {
                if (!showHint) {
                    generateHint();
                }
                setShowHint(!showHint);
            };

            // Clean string helper: removes punctuation and extra spaces
            const normalizeAnswer = (str) => {
                if (!str) return "";
                return str.replace(/[.,!?;:'"]/g, '') // Remove punctuation
                          .replace(/\s+/g, ' ')       // Multiple spaces to single
                          .trim()
                          .toLowerCase();
            };

            const handleMCSelect = (option) => { if (!isAnswered) onAnswer(option); };
            const handleInputSubmit = (e) => { e.preventDefault(); if (!isAnswered && inputVal.trim()) onAnswer(inputVal.trim()); };
            const handlePartClick = (part) => {
                if (isAnswered) return;
                if (selectedParts.includes(part)) setSelectedParts(prev => prev.filter(p => p !== part));
                else setSelectedParts(prev => [...prev, part]);
            };
            const handleRearrangeSubmit = () => { if (!isAnswered && selectedParts.length > 0) onAnswer(selectedParts.join(' ')); };
            
            const isCorrect = () => {
                if (!userAnswer) return false;
                return normalizeAnswer(userAnswer) === normalizeAnswer(question.correctAnswer);
            };

            const renderMedia = () => (
                <div className="mb-6 space-y-4">
                    {question.imageUrl && <div className="rounded-xl overflow-hidden shadow-lg border border-slate-100 bg-slate-50 flex justify-center p-2"><img src={question.imageUrl} alt="Quiz Context" className="max-h-72 w-auto object-contain rounded-lg" onError={(e) => e.target.style.display = 'none'} /></div>}
                    {question.audioUrl && <div className="bg-blue-50 p-4 rounded-xl border border-blue-100"><AudioPlayer src={question.audioUrl.replace(' ', '')} /></div>}
                </div>
            );

            const renderContent = () => {
                if (question.type === QuestionType.MULTIPLE_CHOICE) {
                    return (
                        <div className="grid grid-cols-1 gap-3 mt-4">
                            {question.options?.map((option, idx) => {
                                const isHidden = hiddenOptions.includes(option);
                                let btnClass = "bg-white border-2 border-slate-200 hover:border-blue-400 text-slate-700 hover:shadow-md";
                                
                                if (isHidden) {
                                    btnClass = "bg-slate-100 border-slate-100 text-slate-300 opacity-40 cursor-not-allowed";
                                } else if (isAnswered) {
                                    if (option === question.correctAnswer) btnClass = "bg-green-100 border-green-500 text-green-800 font-bold shadow-sm";
                                    else if (option === userAnswer && userAnswer !== question.correctAnswer) btnClass = "bg-red-100 border-red-500 text-red-800 shadow-sm";
                                    else btnClass = "bg-slate-50 border-slate-100 text-slate-400 opacity-60";
                                } else if (userAnswer === option) btnClass = "bg-blue-50 border-blue-500 text-blue-800";
                                
                                return (
                                    <button key={idx} onClick={() => !isHidden && handleMCSelect(option)} disabled={isAnswered || isHidden} className={`w-full p-4 rounded-xl text-left transition-all duration-200 flex items-center group ${btnClass}`}>
                                        <span className={`w-8 h-8 rounded-full flex items-center justify-center mr-4 text-sm font-bold shrink-0 transition-colors ${isAnswered && option === question.correctAnswer ? 'bg-green-500 text-white' : isHidden ? 'bg-slate-200 text-slate-400' : 'bg-slate-100 text-slate-500 group-hover:bg-blue-100 group-hover:text-blue-600'}`}>{String.fromCharCode(65 + idx)}</span>
                                        <span className="text-lg">{option}</span>
                                    </button>
                                );
                            })}
                        </div>
                    );
                } else if (question.type === QuestionType.FILL_IN_BLANK) {
                    const charCount = cleanStringForHint(inputVal).length;
                    return (
                        <form onSubmit={handleInputSubmit} className="mt-6">
                            <div className="flex flex-col gap-2">
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <input type="text" value={isAnswered && userAnswer ? userAnswer : inputVal} onChange={(e) => setInputVal(e.target.value)} disabled={isAnswered} placeholder="Nhập đáp án của bạn..." className={`flex-1 p-4 rounded-xl border-2 outline-none transition-all text-lg shadow-sm ${isAnswered ? (isCorrect() ? 'border-green-500 bg-green-50 text-green-900 font-medium' : 'border-red-500 bg-red-50 text-red-900 font-medium') : 'border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10'}`} />
                                    {!isAnswered && <Button type="submit" disabled={!inputVal.trim()} className="shrink-0">Trả lời</Button>}
                                </div>
                                {!isAnswered && <div className="text-xs text-slate-400 font-bold text-right px-1">Đã nhập: {charCount} ký tự</div>}
                            </div>
                        </form>
                    );
                } else if (question.type === QuestionType.REARRANGE) {
                    return (
                        <div className="space-y-6 mt-6">
                            <div className="flex flex-wrap gap-3 p-5 bg-slate-50 rounded-xl border border-slate-200 shadow-inner">
                                <span className="w-full text-xs font-bold text-slate-400 uppercase mb-1">Bấm để sắp xếp từ</span>
                                {question.rearrangeParts?.map((part, idx) => {
                                    const isSelected = selectedParts.includes(part);
                                    return (
                                        <button key={idx} onClick={() => handlePartClick(part)} disabled={isAnswered || isSelected} className={`px-4 py-2 rounded-lg text-base font-medium transition-all border-b-2 active:border-b-0 active:translate-y-0.5 ${isSelected ? 'opacity-0 pointer-events-none scale-90' : 'bg-white border-slate-300 hover:border-blue-400 text-slate-700 shadow-sm hover:shadow-md'}`}>{part}</button>
                                    );
                                })}
                            </div>
                            <div className={`min-h-[80px] p-5 rounded-xl border-2 border-dashed flex flex-wrap gap-2 items-center transition-colors ${isAnswered ? (isCorrect() ? 'border-green-500 bg-green-50/50' : 'border-red-500 bg-red-50/50') : 'border-slate-300 bg-white hover:border-blue-400'}`}>
                                {selectedParts.length === 0 && !isAnswered && <div className="w-full text-center text-slate-400 italic flex flex-col items-center gap-2"><span>Tạo câu trả lời tại đây...</span></div>}
                                {selectedParts.map((part, idx) => (<button key={idx} onClick={() => handlePartClick(part)} disabled={isAnswered} className="bg-blue-100 text-blue-900 px-3 py-1.5 rounded-lg border border-blue-200 font-medium shadow-sm hover:bg-red-100 hover:text-red-700 hover:border-red-200 transition-colors">{part}</button>))}
                            </div>
                            {!isAnswered && <div className="flex justify-end"><Button onClick={handleRearrangeSubmit} disabled={selectedParts.length === 0}>Xác nhận</Button></div>}
                        </div>
                    );
                }
            };

            return (
                <div className="w-full max-w-3xl mx-auto mb-8 animate-fade-in">
                    <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
                        <div className="bg-gradient-to-r from-slate-50 to-white px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                             <div className="flex items-center gap-3">
                                <span className="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-extrabold tracking-wider uppercase">{question.type.replace(/_/g, ' ')}</span>
                                <button 
                                    onClick={toggleHint}
                                    disabled={isAnswered}
                                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-all shadow-sm border ${
                                        isAnswered ? 'opacity-50 cursor-not-allowed bg-slate-100 border-slate-200 text-slate-400' :
                                        showHint 
                                        ? 'bg-yellow-100 text-yellow-700 border-yellow-300 ring-2 ring-yellow-200' 
                                        : 'bg-yellow-400 text-yellow-900 border-yellow-500 hover:bg-yellow-500'
                                    }`}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                        <path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14c.015-.34.208-.646.477-.859a4 4 0 10-4.954 0c.27.213.462.519.476.859h4.002z" />
                                    </svg>
                                    {showHint ? 'Ẩn Gợi ý' : 'Gợi ý'}
                                </button>
                            </div>
                            <span className="text-xs font-bold text-slate-300">ID: {question.id}</span>
                        </div>
                        <div className="p-6 sm:p-10">
                            {renderMedia()}
                            
                            {showHint && !isAnswered && (
                                <div className="mb-6 bg-yellow-50 border border-yellow-200 rounded-xl p-4 flex items-start gap-3 animate-fade-in">
                                    <div className="bg-yellow-100 p-2 rounded-full shrink-0">
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-yellow-600" viewBox="0 0 20 20" fill="currentColor">
                                            <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd" />
                                        </svg>
                                    </div>
                                    <div>
                                        <h4 className="text-sm font-bold text-yellow-800 uppercase mb-1">Gợi ý trợ giúp</h4>
                                        <p className="text-yellow-900 text-sm">{hintText}</p>
                                    </div>
                                </div>
                            )}

                            <h2 className="text-xl sm:text-2xl font-bold text-slate-800 mb-6 leading-relaxed whitespace-pre-line">{question.questionText}</h2>
                            {renderContent()}
                            {isAnswered && (
                                <div className={`mt-8 p-6 rounded-xl border-l-4 shadow-sm animate-fade-in ${isCorrect() ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}`}>
                                    <div className="flex items-start gap-4">
                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 text-white font-bold text-lg shadow-md ${isCorrect() ? 'bg-green-500' : 'bg-red-500'}`}>{isCorrect() ? '✓' : '✕'}</div>
                                        <div className="flex-1">
                                            <h3 className={`font-bold text-xl mb-2 ${isCorrect() ? 'text-green-800' : 'text-red-800'}`}>{isCorrect() ? 'Chính xác!' : 'Chưa chính xác'}</h3>
                                            {!isCorrect() && <div className="mb-4 bg-white/60 p-3 rounded-lg border border-red-100 inline-block"><span className="text-red-600 text-sm font-bold uppercase mr-2">Đáp án đúng:</span> <span className="font-bold text-slate-800 text-lg">{question.correctAnswer}</span></div>}
                                            <div className="bg-white/80 p-4 rounded-lg border border-slate-100/50 text-slate-700 leading-relaxed shadow-sm whitespace-pre-wrap"><div className="flex items-center gap-2 mb-2"><span className="font-bold text-xs uppercase text-blue-500">Giải thích</span></div>{question.explanation}</div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ResultScreen
        const ResultScreen = ({ userName, userAnswers, onRetryAll, onRetryWrong }) => {
            const correctCount = userAnswers.filter(a => a.isCorrect).length;
            const totalQuestions = userAnswers.length;
            const percentage = totalQuestions > 0 ? Math.round((correctCount / totalQuestions) * 100) : 0;
            const hasWrongAnswers = correctCount < totalQuestions;
            let message = "Cố gắng lên nhé!", color = "text-slate-600";
            if (percentage === 100) { message = "Xuất sắc! Điểm tuyệt đối!"; color = "text-yellow-500"; }
            else if (percentage >= 80) { message = "Làm tốt lắm!"; color = "text-green-500"; }
            else if (percentage >= 50) { message = "Khá tốt, hãy cố thêm!"; color = "text-blue-500"; }

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4 animate-fade-in">
                    <div className="bg-white rounded-3xl shadow-xl p-8 max-w-2xl w-full text-center">
                        <div className="mb-8 relative inline-block">
                            <svg className="w-40 h-40 transform -rotate-90" viewBox="0 0 120 120">
                                <circle cx="60" cy="60" r="54" fill="none" stroke="#e2e8f0" strokeWidth="12" />
                                <circle cx="60" cy="60" r="54" fill="none" stroke={percentage >= 80 ? '#10b981' : percentage >= 50 ? '#3b82f6' : '#ef4444'} strokeWidth="12" strokeDasharray="339.292" strokeDashoffset={339.292 - (339.292 * percentage) / 100} className="transition-all duration-1000 ease-out" />
                            </svg>
                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center"><span className="text-4xl font-extrabold text-slate-800">{percentage}%</span></div>
                        </div>
                        <h2 className="text-3xl font-bold text-slate-800 mb-2">Hoàn thành bài thi!</h2>
                        <p className="text-lg text-slate-600 mb-4">Chúc mừng bạn <span className="font-bold text-blue-600">{userName}</span>!</p>
                        <p className={`text-xl font-bold mb-8 ${color}`}>{message}</p>
                        <div className="grid grid-cols-2 gap-4 mb-8 bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <div className="p-2"><div className="text-3xl font-bold text-green-600">{correctCount}</div><div className="text-xs text-slate-500 uppercase font-bold">Đúng</div></div>
                            <div className="p-2 border-l border-slate-200"><div className="text-3xl font-bold text-red-500">{totalQuestions - correctCount}</div><div className="text-xs text-slate-500 uppercase font-bold">Sai</div></div>
                        </div>
                        {hasWrongAnswers && (
                            <div className="text-left mb-8 max-h-60 overflow-y-auto custom-scrollbar border-t border-b border-slate-100 py-4">
                                <h3 className="text-sm font-bold text-slate-400 uppercase mb-3">Các câu sai cần xem lại</h3>
                                <div className="space-y-3">
                                    {userAnswers.filter(a => !a.isCorrect).map((ans, idx) => {
                                        const q = QUIZ_DATA.find(q => q.id === ans.questionId);
                                        if (!q) return null;
                                        return <div key={idx} className="text-sm p-3 bg-red-50 rounded-lg"><p className="font-medium text-slate-700 mb-1"><span className="text-red-500 font-bold mr-2">#{q.id}</span> {q.questionText}</p><p className="text-slate-500 text-xs">Đáp án đúng: {q.correctAnswer}</p></div>;
                                    })}
                                </div>
                            </div>
                        )}
                        <div className="flex flex-col sm:flex-row justify-center gap-4">
                            <Button onClick={onRetryAll} variant="primary" className="w-full sm:w-auto">Chơi lại từ đầu</Button>
                            {hasWrongAnswers && <Button onClick={onRetryWrong} variant="danger" className="w-full sm:w-auto">Làm lại câu sai</Button>}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 4. APP LOGIC ---
        const App = () => {
            const [gameState, setGameState] = useState(GameState.START);
            const [userName, setUserName] = useState('');
            const [activeQuestions, setActiveQuestions] = useState([]);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState([]);
            const [showGrid, setShowGrid] = useState(false);

            const handleStart = (name) => { setUserName(name); startSession(QUIZ_DATA); };
            
            const startSession = (questions) => { 
                setActiveQuestions(questions); 
                setCurrentQuestionIndex(0); 
                setUserAnswers([]); 
                setGameState(GameState.PLAYING); 
            };
            
            // Helper for logic match
            const normalizeAnswer = (str) => {
                if (!str) return "";
                return str.replace(/[.,!?;:'"]/g, '') 
                          .replace(/\s+/g, ' ')
                          .trim()
                          .toLowerCase();
            };

            const handleAnswer = (response) => {
                const currentQ = activeQuestions[currentQuestionIndex];
                let isCorrect = false;
                // Using robust check logic
                const normResponse = normalizeAnswer(response);
                const normCorrect = normalizeAnswer(currentQ.correctAnswer);

                isCorrect = normResponse === normCorrect;
                
                const newAnswer = { questionId: currentQ.id, userResponse: response, isCorrect };
                setUserAnswers(prev => [...prev.filter(a => a.questionId !== currentQ.id), newAnswer]);
            };
            
            const handleNext = () => { if (currentQuestionIndex < activeQuestions.length - 1) setCurrentQuestionIndex(prev => prev + 1); };
            const handlePrev = () => { if (currentQuestionIndex > 0) setCurrentQuestionIndex(prev => prev - 1); };
            const handleSkip = () => { handleNext(); };
            const handleFinish = () => { setGameState(GameState.FINISHED); };
            
            const handleRetryAll = () => { startSession(QUIZ_DATA); };
            const handleRetryWrong = () => {
                const wrongIds = userAnswers.filter(a => !a.isCorrect).map(a => a.questionId);
                const wrongQuestions = QUIZ_DATA.filter(q => wrongIds.includes(q.id));
                startSession(wrongQuestions);
            };

            if (gameState === GameState.START) return <StartScreen onStart={handleStart} />;
            if (gameState === GameState.FINISHED) return <ResultScreen userName={userName} userAnswers={userAnswers} onRetryAll={handleRetryAll} onRetryWrong={handleRetryWrong} />;

            const currentQuestion = activeQuestions[currentQuestionIndex];
            const currentAnswerObj = userAnswers.find(a => a.questionId === currentQuestion.id);
            const isAnswered = !!currentAnswerObj;
            const isLastQuestion = currentQuestionIndex === activeQuestions.length - 1;
            const allAnswered = userAnswers.length === activeQuestions.length;

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col items-center py-8 px-4 pb-32 relative">
                    <div className="w-full max-w-3xl flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm">
                        <div className="flex flex-col"><span className="text-xs font-bold text-slate-400 uppercase">Người chơi</span><span className="font-bold text-slate-700">{userName}</span></div>
                        <button onClick={() => setShowGrid(true)} className="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-bold text-slate-600 transition-colors"><svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>Danh sách</button>
                        <div className="flex flex-col items-end"><span className="text-xs font-bold text-slate-400 uppercase">Tiến độ</span><span className="font-bold text-blue-600 text-xl">{currentQuestionIndex + 1} <span className="text-slate-400 text-sm">/ {activeQuestions.length}</span></span></div>
                    </div>
                    <div className="w-full max-w-3xl bg-slate-200 rounded-full h-2 mb-8 overflow-hidden"><div className="bg-blue-600 h-full transition-all duration-300 ease-out" style={{ width: `${(userAnswers.length / activeQuestions.length) * 100}%` }}></div></div>
                    <QuestionCard question={currentQuestion} onAnswer={handleAnswer} isAnswered={isAnswered} userAnswer={currentAnswerObj?.userResponse || null} />
                    <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-10">
                        <div className="w-full max-w-3xl mx-auto flex justify-between items-center gap-4">
                            <Button onClick={handlePrev} variant="outline" disabled={currentQuestionIndex === 0} className="w-24">← Trước</Button>
                            <div className="flex-1 flex justify-center gap-3">
                                {isAnswered ? (
                                    <>
                                        {!isLastQuestion && <Button onClick={handleNext} size="md" className="shadow-xl shadow-blue-500/20 animate-bounce-short">Câu tiếp theo →</Button>}
                                        <Button onClick={handleFinish} variant={allAnswered ? "secondary" : "danger"}>Nộp bài</Button>
                                    </>
                                ) : (
                                    <Button onClick={handleSkip} variant="outline" className="text-slate-400 border-slate-200 hover:bg-slate-50 hover:text-slate-600">Bỏ qua</Button>
                                )}
                            </div>
                            <Button onClick={handleNext} variant="outline" disabled={isLastQuestion} className={`w-24 ${isAnswered ? 'opacity-0 pointer-events-none hidden sm:flex' : ''}`}>Sau →</Button>
                        </div>
                    </div>
                    {showGrid && <QuestionGrid questions={activeQuestions} userAnswers={userAnswers} currentIndex={currentQuestionIndex} onJump={setCurrentQuestionIndex} onClose={() => setShowGrid(false)} />}
                </div>
            );
        };

        // --- 5. MOUNT ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
